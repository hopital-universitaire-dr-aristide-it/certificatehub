services:

  # ──────────────────────────────────────────────────────────
  # nginx — proxy HTTP/HTTPS + fichiers statiques (API + SPA React)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: certhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api/public:/var/www/html/public:ro
      - ./web/dist:/var/www/web:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - certhub_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────
  # app — Laravel 11, PHP 8.3-FPM
  # ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: certhub_app
    restart: unless-stopped
    environment:
      APP_ENV:            ${APP_ENV}
      APP_KEY:             ${APP_KEY}
      APP_DEBUG:           ${APP_DEBUG:-false}
      APP_URL:             ${APP_URL}
      DB_HOST:             postgres
      DB_PORT:             5432
      DB_DATABASE:         ${DB_DATABASE:-certhub_db}
      DB_USERNAME:         ${DB_USERNAME:-certhub_user}
      DB_PASSWORD:         ${DB_PASSWORD}
      REDIS_HOST:          redis
      REDIS_PORT:          6379
      REDIS_PASSWORD:      ${REDIS_PASSWORD}
      CACHE_DRIVER:        redis
      QUEUE_CONNECTION:    redis
      SESSION_DRIVER:      redis
      FILESYSTEM_DISK:     local
      BACKBLAZE_KEY_ID:    ${BACKBLAZE_KEY_ID}
      BACKBLAZE_APP_KEY:   ${BACKBLAZE_APP_KEY}
      BACKBLAZE_BUCKET:    ${BACKBLAZE_BUCKET}
      TYPESENSE_HOST:      ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT:      ${TYPESENSE_PORT:-8108}
      TYPESENSE_API_KEY:   ${TYPESENSE_API_KEY}
      LOG_CHANNEL:         stack
      LOG_LEVEL:           ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - certhub_net
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────────────────
  # postgres — PostgreSQL 16 avec extensions
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: certhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-certhub_db}
      POSTGRES_USER:     ${DB_USERNAME:-certhub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    ports:
      - "${DB_EXTERNAL_PORT:-5434}:5432"
    networks:
      - certhub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-certhub_user} -d ${DB_DATABASE:-certhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # redis — Cache, sessions, queues
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: certhub_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - certhub_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # typesense — Recherche (patients, certificats)
  # ──────────────────────────────────────────────────────────
  typesense:
    image: typesense/typesense:0.25.2
    container_name: certhub_typesense
    restart: unless-stopped
    mem_limit: 512m
    command: "--data-dir=/data --api-key=${TYPESENSE_API_KEY} --listen-port=8108"
    volumes:
      - typesense_data:/data
    # Pas de healthcheck : l'image officielle n'embarque ni curl ni wget ni nc,
    # et rien d'autre dans la stack ne conditionne son demarrage sur "healthy".
    networks:
      - certhub_net

  # ──────────────────────────────────────────────────────────
  # worker — Laravel Queue
  # ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: certhub_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV:          ${APP_ENV}
      APP_KEY:          ${APP_KEY}
      DB_HOST:          postgres
      DB_PORT:          5432
      DB_DATABASE:      ${DB_DATABASE:-certhub_db}
      DB_USERNAME:      ${DB_USERNAME:-certhub_user}
      DB_PASSWORD:      ${DB_PASSWORD}
      REDIS_HOST:       redis
      REDIS_PORT:       6379
      REDIS_PASSWORD:   ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      BACKBLAZE_KEY_ID:  ${BACKBLAZE_KEY_ID}
      BACKBLAZE_APP_KEY: ${BACKBLAZE_APP_KEY}
      BACKBLAZE_BUCKET:  ${BACKBLAZE_BUCKET}
      TYPESENSE_HOST:    ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT:    ${TYPESENSE_PORT:-8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - certhub_net

  # ──────────────────────────────────────────────────────────
  # scheduler — Laravel Schedule (cron)
  # ──────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${APP_ENV:-development}
    container_name: certhub_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV:        ${APP_ENV}
      APP_KEY:        ${APP_KEY}
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_DATABASE:    ${DB_DATABASE:-certhub_db}
      DB_USERNAME:    ${DB_USERNAME:-certhub_user}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - certhub_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  typesense_data:
    driver: local
  app_storage:
    driver: local
  nginx_logs:
    driver: local

networks:
  certhub_net:
    driver: bridge
