services:
  # NOTE: vendor/ est masque par un volume nomme (vendor_data), pas servi
  # depuis le bind mount Windows. Chaque require() PHP d'une classe vendor
  # traverse sinon la couche de partage de fichiers Windows -> conteneur, ce
  # qui a mesure faisait passer un simple `php artisan --version` de <1s a
  # ~20s (des milliers de petits fichiers dans vendor/). Meme pattern deja
  # utilise pour node_modules sur le service web ci-dessous. storage/ reste
  # sur le bind mount (deja peuple par le scaffold Laravel, pas assez de
  # fichiers pour que ce soit sensible, et on veut voir les logs generes).
  app:
    # -R : autorise le pool php-fpm a tourner en user=root (www.dev.conf) —
    # necessaire car les fichiers bind-montes depuis Windows appartiennent a
    # root sans droit d'ecriture pour www-data. Sans impact prod (stage/pool
    # separes).
    command: ["php-fpm", "-R"]
    volumes:
      - ./api:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
    environment:
      APP_DEBUG: "true"
      APP_ENV:   local
      LOG_LEVEL: debug

  worker:
    volumes:
      - ./api:/var/www/html:cached
      - vendor_data:/var/www/html/vendor

  scheduler:
    volumes:
      - ./api:/var/www/html:cached
      - vendor_data:/var/www/html/vendor

  # Vite dev server — hot reload React
  web:
    image: node:20-alpine
    container_name: certhub_web_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - certhub_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: certhub_mailpit
    restart: unless-stopped
    ports:
      # Ports décalés : 1025/8025 déjà pris par un autre projet Docker sur ce poste
      - "1026:1025"
      - "8026:8025"
    networks:
      - certhub_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: certhub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@certhub.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - certhub_net
    profiles:
      - tools

volumes:
  vendor_data:
