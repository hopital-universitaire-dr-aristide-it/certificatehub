# En-tetes de securite valables sur HTTP comme sur HTTPS.
#
# HSTS n'est PAS ici volontairement : la RFC 6797 interdit d'emettre
# Strict-Transport-Security sur un transport non chiffre. Il est declare
# directement dans les blocs `server` en ecoute 443 (default.conf,
# default.prod.conf).

add_header X-Content-Type-Options "nosniff"        always;
add_header X-Frame-Options        "DENY"           always;
add_header X-XSS-Protection       "1; mode=block"  always;
add_header Referrer-Policy        "strict-origin"  always;
