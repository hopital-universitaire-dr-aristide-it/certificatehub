# Blocs `location` communs a l'ecoute HTTP et HTTPS, et aux configurations dev
# (default.conf) et prod (default.prod.conf). Un seul endroit a modifier : les
# deux fichiers l'incluent, ils ne peuvent donc pas deriver l'un de l'autre.
#
# A inclure a l'interieur d'un bloc `server`.

location = /up {
    try_files $uri /index.php?$query_string;
}

# API Laravel
location /api {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    fastcgi_pass   app:9000;
    fastcgi_index  index.php;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_read_timeout 120;
}

# Frontend React (build statique servi directement par nginx)
location / {
    root /var/www/web;
    try_files $uri /index.html;
}

location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root /var/www/web;
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Reinclusion deliberee : des qu'un `location` declare son propre
    # add_header, nginx cesse d'heriter de ceux du bloc `server` parent. Sans
    # cette ligne, les assets statiques repartaient sans aucun en-tete de
    # securite (nosniff, X-Frame-Options, HSTS...).
    include /etc/nginx/snippets/security-headers.conf;

    try_files $uri =404;
}

location ~ /\.(env|git|htaccess) {
    deny all;
}

location ~ ^/(storage|bootstrap/cache) {
    deny all;
}

client_max_body_size 30M;
