# Configuration nginx de base — utilisee telle quelle en developpement.
#
# En production, docker-compose.prod.yml monte default.prod.conf par-dessus :
# l'ecoute 80 y redirige tout vers HTTPS au lieu de servir l'application.
# Les blocs `location` sont partages via snippets/app.conf, les deux fichiers
# ne peuvent donc pas deriver l'un de l'autre.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;

    access_log /var/log/nginx/certhub_access.log;
    error_log  /var/log/nginx/certhub_error.log;
}

# HTTPS (LAN — certificat auto-signe, genere par scripts/generate-tls-cert.sh)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Directive `http2 on` (nginx >= 1.25.1) et non `listen ... http2`, forme
    # depreciee qui emet un avertissement au demarrage sur cette version.
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;

    access_log /var/log/nginx/certhub_access.log;
    error_log  /var/log/nginx/certhub_error.log;
}
