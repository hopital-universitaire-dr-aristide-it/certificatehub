server {
    listen 80;
    listen [::]:80;
    server_name _;

    # En prod, décommenter pour forcer HTTPS :
    # return 301 https://$host$request_uri;

    # 127.0.0.11 = DNS interne de Docker. "app" n'est PAS mis en cache
    # indéfiniment grâce a la variable $upstream_app juste en dessous (une
    # cible fastcgi_pass statique, elle, est résolue une seule fois au
    # démarrage de nginx et reste figée sur cette IP même si le conteneur
    # "app" est recréé ailleurs — cause du 502/silence total du 19 août,
    # qui necessitait un redemarrage manuel de nginx pour se corriger).
    resolver 127.0.0.11 valid=10s;

    root /var/www/html/public;
    index index.php;

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app;
        fastcgi_pass   $upstream_app:9000;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Frontend React (build statique servi directement par nginx)
    location / {
        root /var/www/web;
        try_files $uri /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }

    access_log /var/log/nginx/certhub_access.log;
    error_log  /var/log/nginx/certhub_error.log;

    client_max_body_size 30M;
}

# HTTPS (LAN — certificat auto-signé)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "DENY"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin" always;

    resolver 127.0.0.11 valid=10s;

    root /var/www/html/public;
    index index.php;

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app;
        fastcgi_pass   $upstream_app:9000;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location / {
        root /var/www/web;
        try_files $uri /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }

    client_max_body_size 30M;
}
