# Configuration nginx de PRODUCTION — montee par docker-compose.prod.yml
# par-dessus /etc/nginx/conf.d/default.conf.
#
# Seule difference avec default.conf : l'ecoute 80 ne sert plus l'application,
# elle redirige tout vers HTTPS. Un certificat medical est un document
# medico-legal contenant des donnees de sante — meme sur le LAN de l'hopital il
# ne transite pas en clair (position DOC-11 du depot hms). Les blocs `location`
# viennent du meme snippets/app.conf que la config de dev.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 301 et non 302 : les navigateurs des postes de l'hopital memorisent la
    # redirection, la requete en clair ne se repete pas a chaque visite.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Le certificat etant auto-signe, il n'y a pas de chaine a agrafer : ni
    # OCSP stapling ni resolver ne sont configures ici (ils echoueraient a
    # chaque demarrage en produisant des avertissements inutiles).

    root /var/www/html/public;
    index index.php;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;

    access_log /var/log/nginx/certhub_access.log;
    error_log  /var/log/nginx/certhub_error.log;
}
