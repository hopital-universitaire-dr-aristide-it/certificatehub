[www]
; Variante dev de www.conf : tourne en root, cote conteneur.
; Necessaire car le code est bind-mounte depuis un hote Windows (Docker Desktop) —
; la traduction de permissions NTFS->Linux donne des repertoires appartenant a
; root sans droit d'ecriture pour "other", donc www-data ne peut pas ecrire
; dans storage/ (cache, logs, vues compilees). Sans impact en production :
; la prod utilise www.conf (www-data) avec du code copie et chown a la build.
user = root
group = root

listen = 9000
listen.owner = root
listen.group = root

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
