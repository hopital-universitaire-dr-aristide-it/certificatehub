[xdebug]
xdebug.mode = develop,debug
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
; "trigger" evite qu'xdebug tente une connexion de debug (et bloque ~10s en
; timeout reseau sur Docker Desktop/Windows) sur CHAQUE requete HTTP — il ne
; se declenche que si un IDE envoie explicitement le cookie/parametre trigger.
xdebug.start_with_request = trigger
