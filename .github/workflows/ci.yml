name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: certhub_test
          POSTGRES_USER: certhub_test
          POSTGRES_PASSWORD: certhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U certhub_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: api

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: certhub_test
      DB_USERNAME: certhub_test
      DB_PASSWORD: certhub_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      # Le service postgres ci-dessus est une image nue, sans le script
      # docker/postgres/init.sql que docker-compose.yml monte en prod/dev —
      # sans ca, unaccent_lower() (utilisee par la migration patients pour
      # l'index de recherche/dedup) n'existe pas et toute migration echoue.
      - name: Activer unaccent/pg_trgm sur la base de test
        run: |
          PGPASSWORD=certhub_test psql -h 127.0.0.1 -U certhub_test -d certhub_test <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS unaccent;
          CREATE OR REPLACE FUNCTION unaccent_lower(text)
          RETURNS text AS $$
            SELECT unaccent(lower($1));
          $$ LANGUAGE sql IMMUTABLE;
          SQL

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, mbstring, intl, gd, zip, bcmath
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Create .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Lint (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run tests with coverage (min 75%)
        run: php artisan test --coverage --min=75

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (min 75% lines/statements/functions, 60% branches)
        run: npm run test:coverage

      - name: Type-check + build
        run: npm run build

  docker-build:
    name: Docker images build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image (production target)
        run: docker build -f docker/php/Dockerfile --target production -t certhub-api:ci ./api

      - name: Build frontend static assets
        run: docker build --target export -o /tmp/web-dist ./web
